# EDAM PILOT — Debezium Server 2.7.3 connector config (operator-supplied).
# EXTERNAL Kafel MySQL -> Redis Streams sink. The CDC user MUST be READ-ONLY (INV-1).
# Produces stream keys `kafel.kafel.<table>` consumed by the collector (CDC_SOURCE_STREAMS).
# Replace ${KAFEL_DB_HOST}/${KAFEL_DB_PORT}/${KAFEL_CDC_USER}/${KAFEL_CDC_PASSWORD} via env.

# ---- Sink: Redis Streams (same Redis the collector reads) ----
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379
debezium.sink.redis.null.value=null

# ---- Source: MySQL (Kafel) — READ-ONLY (INV-1) ----
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.topic.prefix=kafel
debezium.source.database.hostname=${KAFEL_DB_HOST}
debezium.source.database.port=${KAFEL_DB_PORT}
debezium.source.database.user=${KAFEL_CDC_USER}
debezium.source.database.password=${KAFEL_CDC_PASSWORD}
debezium.source.database.server.id=184254
debezium.source.database.include.list=kafel
debezium.source.table.include.list=kafel.users,kafel.roles,kafel.permissions,kafel.user_roles,kafel.beneficiaries,kafel.wallets,kafel.campaigns,kafel.donations,kafel.ledger_entries,kafel.audit_scratch

# Fidelity: full before/after row images + GTID continuity
debezium.source.snapshot.mode=initial
debezium.source.binary.handling.mode=base64

# Offset + schema-history storage (persisted on the debezium-data volume)
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=10000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# Keep keys/values as JSON the collector's decodeRedisEntry expects
debezium.format.key=json
debezium.format.value=json
debezium.source.key.converter.schemas.enable=false
debezium.source.value.converter.schemas.enable=false
