# EDAM local development stack (Epic E7 / EDAM-T048).
# Provides: monitored MySQL (ROW+FULL+GTID, native audit stand-in), MariaDB
# (Audit Plugin reference + second-engine adapter target), Debezium Server
# (MySQL -> Redis Streams; no Kafka per Engineering Blueprint MVP), Redis bus,
# PostgreSQL (EDAM collector state), and Vault (dev secret store).
#
# All credentials here are throwaway DEV defaults overridable via .env (see
# .env.example). The CDC user is provisioned READ-ONLY (INV-1: EDAM never
# writes to the monitored database).
name: edam-dev

services:
  # -------------------------------------------------------------------------
  # Monitored database (primary) - MySQL with ROW+FULL+GTID binlog.
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: edam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${KAFEL_DB:-kafel}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql/edam.cnf:/etc/mysql/conf.d/edam.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ../../db/seed:/seed:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------------------------
  # Second-engine target + native Audit Plugin reference - MariaDB.
  # -------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    container_name: edam-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpw}
      MARIADB_DATABASE: ${KAFEL_DB:-kafel}
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - ./mariadb/edam.cnf:/etc/mysql/conf.d/edam.cnf:ro
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      - ../../db/seed:/seed:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------------------------
  # Internal event bus - Redis Streams.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edam-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # CDC collector runtime - Debezium Server (MySQL source -> Redis sink).
  # -------------------------------------------------------------------------
  debezium:
    image: debezium/server:2.7.3.Final
    container_name: edam-debezium
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./debezium/conf:/debezium/conf:ro
      - debezium-data:/debezium/data
    ports:
      - "${DEBEZIUM_PORT:-8083}:8080"

  # -------------------------------------------------------------------------
  # EDAM collector state store - PostgreSQL (offset/DLQ/config-snapshot DB).
  # Tables are added in later epics (E2/E3/E5); E7 only provisions the DB.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: edam-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-edam}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-edampw}
      POSTGRES_DB: ${PG_DB:-edam_state}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-edam} -d ${PG_DB:-edam_state}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Secret store - Vault (dev mode). Holds the read-only CDC credential ref.
  # -------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: edam-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-edam-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # WORM evidence store (Sprint-2 / EDAM-T104) - MinIO with S3 Object Lock.
  # The bucket is created with Object Lock + versioning by the evidence writer
  # (compliance-mode retention, W-1/W-2/W-4). DEV throwaway credentials only;
  # production uses a real Object-Lock-capable store with dual-control identities.
  # -------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: edam-minio
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20

  # -------------------------------------------------------------------------
  # WORM bucket bootstrap (Sprint-2 / EDAM-T160) - one-shot minio/mc.
  # Pre-creates the evidence bucket with Object Lock + versioning so the live
  # harness (T161) has a ready WORM target. The writer's ensureBucket() remains
  # the final idempotent guard. Exits 0 after bootstrap (run-once).
  # -------------------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: edam-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-edam-evidence}
    entrypoint: ["/bin/sh", "/init/init-bucket.sh"]
    volumes:
      - ./minio/init-bucket.sh:/init/init-bucket.sh:ro
    restart: "no"

  # -------------------------------------------------------------------------
  # Dev signer (Sprint-2 / EDAM-T160) - DEV TOPOLOGY/HEALTH STAND-IN ONLY.
  # Represents the production HSM signing service (S-4). NOT the real signing
  # path: T161 signs anchor payloads IN-PROCESS via @edam/signing (no drift).
  # Zero-dependency Node stub; plain HTTP (production uses mTLS + a real HSM).
  # -------------------------------------------------------------------------
  dev-signer:
    image: node:20-alpine
    container_name: edam-dev-signer
    command: ["node", "/srv/server.mjs"]
    environment:
      DEV_SIGNER_PORT: ${DEV_SIGNER_PORT:-8090}
    ports:
      - "${DEV_SIGNER_PORT:-8090}:8090"
    volumes:
      - ./dev-signer/server.mjs:/srv/server.mjs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8090/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Dev TSA / transparency log (Sprint-2 / EDAM-T160) - DEV STAND-IN ONLY.
  # Represents the external RFC-3161 TSA + RFC-6962 transparency log (S-4). NOT
  # the real anchoring path: T161 anchors IN-PROCESS via @edam/anchoring (no
  # drift). Zero-dependency Node stub; plain HTTP (production uses mTLS).
  # -------------------------------------------------------------------------
  dev-tsa-log:
    image: node:20-alpine
    container_name: edam-dev-tsa-log
    command: ["node", "/srv/server.mjs"]
    environment:
      DEV_TSA_LOG_PORT: ${DEV_TSA_LOG_PORT:-8091}
    ports:
      - "${DEV_TSA_LOG_PORT:-8091}:8091"
    volumes:
      - ./dev-tsa-log/server.mjs:/srv/server.mjs:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8091/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  mariadb-data:
  redis-data:
  debezium-data:
  postgres-data:
  minio-data:
