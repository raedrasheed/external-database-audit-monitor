# EDAM local development stack (Epic E7 / EDAM-T048).
# Provides: monitored MySQL (ROW+FULL+GTID, native audit stand-in), MariaDB
# (Audit Plugin reference + second-engine adapter target), Debezium Server
# (MySQL -> Redis Streams; no Kafka per Engineering Blueprint MVP), Redis bus,
# PostgreSQL (EDAM collector state), and Vault (dev secret store).
#
# All credentials here are throwaway DEV defaults overridable via .env (see
# .env.example). The CDC user is provisioned READ-ONLY (INV-1: EDAM never
# writes to the monitored database).
name: edam-dev

services:
  # -------------------------------------------------------------------------
  # Monitored database (primary) - MySQL with ROW+FULL+GTID binlog.
  # -------------------------------------------------------------------------
  mysql:
    image: mysql:8.0
    container_name: edam-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpw}
      MYSQL_DATABASE: ${KAFEL_DB:-kafel}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - ./mysql/edam.cnf:/etc/mysql/conf.d/edam.cnf:ro
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
      - ../../db/seed:/seed:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-rootpw}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------------------------
  # Second-engine target + native Audit Plugin reference - MariaDB.
  # -------------------------------------------------------------------------
  mariadb:
    image: mariadb:11.4
    container_name: edam-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-rootpw}
      MARIADB_DATABASE: ${KAFEL_DB:-kafel}
    ports:
      - "${MARIADB_PORT:-3307}:3306"
    volumes:
      - ./mariadb/edam.cnf:/etc/mysql/conf.d/edam.cnf:ro
      - ./mariadb/init:/docker-entrypoint-initdb.d:ro
      - ../../db/seed:/seed:ro
      - mariadb-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  # -------------------------------------------------------------------------
  # Internal event bus - Redis Streams.
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: edam-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  # -------------------------------------------------------------------------
  # CDC collector runtime - Debezium Server (MySQL source -> Redis sink).
  # -------------------------------------------------------------------------
  debezium:
    image: debezium/server:2.7.3.Final
    container_name: edam-debezium
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
      - ./debezium/conf:/debezium/conf:ro
      - debezium-data:/debezium/data
    ports:
      - "${DEBEZIUM_PORT:-8083}:8080"

  # -------------------------------------------------------------------------
  # EDAM collector state store - PostgreSQL (offset/DLQ/config-snapshot DB).
  # Tables are added in later epics (E2/E3/E5); E7 only provisions the DB.
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: edam-postgres
    environment:
      POSTGRES_USER: ${PG_USER:-edam}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-edampw}
      POSTGRES_DB: ${PG_DB:-edam_state}
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-edam} -d ${PG_DB:-edam_state}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # -------------------------------------------------------------------------
  # Secret store - Vault (dev mode). Holds the read-only CDC credential ref.
  # -------------------------------------------------------------------------
  vault:
    image: hashicorp/vault:1.17
    container_name: edam-vault
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_ROOT_TOKEN:-edam-dev-root}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  mysql-data:
  mariadb-data:
  redis-data:
  debezium-data:
  postgres-data:
