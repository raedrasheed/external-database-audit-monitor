# Debezium Server configuration (Epic E7 / EDAM-T048).
# MySQL source -> Redis Streams sink. No Kafka (per Engineering Blueprint MVP:
# a lightweight bus is used until >=2 sources / real throughput).
#
# Offsets and schema history are file-backed on the debezium-data volume so the
# collector resumes exactly across restarts. Dev credentials only; production
# injects the read-only CDC credential from Vault.

# --- Sink: Redis Streams ---
debezium.sink.type=redis
debezium.sink.redis.address=redis:6379

# --- Source: MySQL connector ---
debezium.source.connector.class=io.debezium.connector.mysql.MySqlConnector
debezium.source.topic.prefix=kafel
debezium.source.database.hostname=mysql
debezium.source.database.port=3306
debezium.source.database.user=cdc
debezium.source.database.password=cdc_pw
debezium.source.database.server.id=184054
debezium.source.database.include.list=kafel
debezium.source.table.include.list=kafel.donations,kafel.wallets,kafel.beneficiaries,kafel.campaigns,kafel.users,kafel.roles,kafel.permissions,kafel.user_roles,kafel.ledger_entries

# Initial snapshot then stream; record GTID continuity for completeness.
debezium.source.snapshot.mode=initial

# File-backed offset + schema history (durable resume).
debezium.source.offset.storage.file.filename=/debezium/data/offsets.dat
debezium.source.offset.flush.interval.ms=1000
debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
debezium.source.schema.history.internal.file.filename=/debezium/data/schema-history.dat

# Preserve full before/after fidelity in emitted events.
debezium.source.binary.handling.mode=base64
# Money/decimals as exact strings (CCE §12.8 — never floating point).
debezium.source.decimal.handling.mode=string
debezium.format.value=json
debezium.format.value.schemas.enable=false
debezium.format.key=json
debezium.format.key.schemas.enable=false

# Low-rate heartbeat supports the Completeness Watcher (idle vs stalled).
debezium.source.heartbeat.interval.ms=10000
