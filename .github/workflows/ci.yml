# EDAM CI pipeline (Epic E7 / EDAM-T051).
#
# Runs the build/test suite on TWO OS/arch targets (ubuntu = x86_64-linux,
# macos = arm64-darwin). This is the foundation for the determinism gate
# (CCE C-1/C-6, full rig lands in Epic E6 / EDAM-T041): once the canonical
# package (Epic E1) exists, identical canonical bytes / event_hash / envelope_id
# must be produced on both targets.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build + test on two distinct OS/arch targets.
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + fixture tests
        run: npm test

  # Determinism gate (foundation). Asserts no fabricated golden values pre-E1;
  # becomes the full two-target hash comparison once Epic E1/E6 land.
  determinism:
    name: determinism-gate
    runs-on: ubuntu-latest
    needs: build-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Verify golden values not fabricated (INV-2)
        run: npm run fixtures:pin -- --check

  # Validate the dev Compose stack configuration (no full bring-up).
  compose-validate:
    name: compose-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose -f deploy/compose/docker-compose.yml config >/dev/null

  # Invariant guard: no Kafel write credential grant in the dev provisioning
  # (foundation for the automated INV-1 proof in Epic E8 / EDAM-T052).
  invariant-no-write:
    name: invariant-no-write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert CDC users are granted no write privileges
        run: |
          set -euo pipefail
          if grep -RniE 'GRANT[^;]*\b(INSERT|UPDATE|DELETE|CREATE|DROP|ALTER|ALL PRIVILEGES)\b' \
               deploy/compose/mysql/init deploy/compose/mariadb/init; then
            echo "INV-1 violation: a monitored-DB user was granted write privileges." >&2
            exit 1
          fi
          echo "INV-1 OK: no write grants in CDC/audit provisioning."
