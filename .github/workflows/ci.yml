# EDAM CI pipeline (Epic E7 / EDAM-T051, extended in Epic E6).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # Build + test on two distinct OS/arch targets.
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + fixture + conformance tests
        run: npm test

  # Lint gate (Epic E6 / mandate E).
  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - run: npm run lint

  # Coverage gate (Epic E6 / EDAM-T047, mandate D).
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Coverage with thresholds
        run: npm run test:coverage

  # Formal conformance suite (Epic E6 / EDAM-T042..T046, mandate B).
  conformance:
    name: conformance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Run conformance report (C1/C3/C4/C5/C6/C7/C8/C10)
        run: npm run conformance
      - uses: actions/upload-artifact@v4
        with:
          name: conformance-report
          path: conformance-report.json

  # Cross-target determinism rig (Epic E6 / EDAM-T041, mandate A): produce an
  # artifact of envelope_id/event_hash/row_hash + serializer probe per target.
  determinism-rig:
    name: determinism-rig (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Build determinism artifact
        run: npx tsx conformance/scripts/determinism-rig.ts > determinism-${{ matrix.os }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: determinism-${{ matrix.os }}
          path: determinism-${{ matrix.os }}.json

  # Gating comparison: ubuntu vs macos must produce identical results+probe.
  determinism-compare:
    name: determinism-compare (GATE)
    runs-on: ubuntu-latest
    needs: determinism-rig
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          name: determinism-ubuntu-latest
          path: artifacts/ubuntu
      - uses: actions/download-artifact@v4
        with:
          name: determinism-macos-latest
          path: artifacts/macos
      - name: Compare cross-target determinism (fail on any mismatch)
        run: npm run determinism:compare -- artifacts/ubuntu/determinism-ubuntu-latest.json artifacts/macos/determinism-macos-latest.json

  # No-write-path proof (Epic E6 / mandate C; pulls forward EDAM-T052):
  # scan provisioning + runtime source/config for monitored-DB write capability.
  # Comprehensive no-write-path proof (Epic E8 / EDAM-T052): scan source +
  # config + env + compose + deployment + CDC source user for monitored-DB
  # write capability; emit a machine-verifiable proof artifact.
  no-write-proof:
    name: no-write-proof (INV-1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: npm install --no-audit --no-fund
      - name: Assert no monitored-DB write path (+ emit proof)
        run: npm run no-write-proof -- --check --report
      - uses: actions/upload-artifact@v4
        with:
          name: no-write-path-proof
          path: no-write-path-proof.json

  # Validate the dev Compose stack configuration (no full bring-up).
  compose-validate:
    name: compose-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker compose config
        run: docker compose -f deploy/compose/docker-compose.yml config >/dev/null
